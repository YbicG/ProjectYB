<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- True OLED Black Canvas -->
    <linearGradient id="oledBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#000000" />
      <stop offset="100%" stop-color="#040405" />
    </linearGradient>

    <!-- Subtle Titanium Rim -->
    <linearGradient id="titaniumRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>

    <!-- Pure Platinum Monogram Gradient -->
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#E4E4E7" />
    </linearGradient>

    <!-- Sleek Stealth Accent Gradient -->
    <linearGradient id="stealthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1A1AA" />
      <stop offset="100%" stop-color="#52525B" />
    </linearGradient>

    <!-- Precision Drop Shadow -->
    <filter id="crispShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- OLED Black Squircle Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#oledBlack)" stroke="url(#titaniumRim)" stroke-width="2" />

  <!-- Minimalist Geometric Apex Monogram (Precision Architectural 'Y' Nexus) -->
  <g filter="url(#crispShadow)">
    <!-- Top-Left Angled Blade -->
    <path
      d="M 148 140 L 216 140 L 256 228 L 222 258 L 132 168 C 122 154 132 140 148 140 Z"
      fill="url(#platinumGrad)"
    />

    <!-- Top-Right Angled Blade -->
    <path
      d="M 364 140 L 296 140 L 256 228 L 290 258 L 380 168 C 390 154 380 140 364 140 Z"
      fill="url(#platinumGrad)"
    />

    <!-- Center Keystone Diamond Pivot -->
    <polygon points="256,204 286,248 256,292 226,248" fill="#FFFFFF" />

    <!-- Sleek Vertical Foundation Pillar -->
    <path
      d="M 238 272 L 274 272 L 274 380 C 274 394 266 402 256 402 C 246 402 238 394 238 380 Z"
      fill="url(#platinumGrad)"
    />

    <!-- Subtle Right Stealth Carbon Accent Arc (Minimalist 'B' Counterpart) -->
    <path
      d="M 274 282 C 322 282 352 308 352 344 C 352 380 320 402 274 402 L 274 372 C 304 372 322 360 322 344 C 322 326 304 312 274 312 Z"
      fill="url(#stealthGrad)"
      opacity="0.75"
    />
  </g>
</svg>