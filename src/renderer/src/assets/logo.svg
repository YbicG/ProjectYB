<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17" />
      <stop offset="50%" stop-color="#111425" />
      <stop offset="100%" stop-color="#07080f" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Primary Violet Glyph Gradient -->
    <linearGradient id="violetBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Cyan Radiant Glyph Gradient -->
    <linearGradient id="cyanBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Emerald / Teal Accent Gradient -->
    <linearGradient id="emeraldLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Amber Core Accent -->
    <linearGradient id="amberCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.5" filter="url(#shadow)" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="180" r="130" fill="#8B5CF6" opacity="0.12" />
  <circle cx="256" cy="330" r="120" fill="#06B6D4" opacity="0.10" />

  <!-- Geometric Hexagonal / Diamond Monogram ("YB") -->
  <g filter="url(#shadow)">
    <!-- Top Left Arm ("Y" Left Blade) -->
    <path d="M 148 132 L 216 132 L 256 216 L 212 264 L 140 168 Z" fill="url(#violetBlade)" />

    <!-- Top Right Arm ("Y" Right Blade) -->
    <path d="M 364 132 L 296 132 L 256 216 L 300 264 L 372 168 Z" fill="url(#cyanBlade)" />

    <!-- Central Diamond Apex -->
    <polygon points="256,196 280,238 256,276 232,238" fill="#FFFFFF" opacity="0.95" />

    <!-- 'B' Top Loop -->
    <path d="M 232 256 L 284 256 C 330 256 356 276 356 310 C 356 342 328 362 284 362 L 232 362 Z" fill="url(#cyanBlade)" />

    <!-- 'B' Main Spine & Bottom Loop -->
    <path d="M 232 350 L 290 350 C 340 350 370 374 370 410 C 370 448 334 468 284 468 L 160 468 C 146 468 136 456 136 442 L 136 168 L 192 168 L 192 414 L 280 414 C 304 414 316 404 316 392 C 316 378 304 370 280 370 L 232 370 Z" fill="url(#violetBlade)" />

    <!-- 'B' Inner Geometric Cutouts -->
    <path d="M 244 294 L 280 294 C 298 294 308 302 308 312 C 308 322 298 330 280 330 L 244 330 Z" fill="#111425" />
    <path d="M 244 390 L 284 390 C 304 390 316 398 316 408 C 316 418 304 426 284 426 L 244 426 Z" fill="#111425" />
  </g>
</svg>